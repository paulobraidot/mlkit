name: Android CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare MLKit.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MLKit.apk

      - name: Upload MLKit APK
        uses: actions/upload-artifact@v4
        with:
          name: MLKit.apk
          path: MLKit.apk

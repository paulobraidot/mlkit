apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.google.mlkit.app"
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.google.mlkit.samples"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        setProperty("archivesBaseName", "MLKit")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    aaptOptions {
        noCompress "tflite"
    }
}

dependencies {
    implementation project(':chooserx')
    implementation project(':android-snippets')
    implementation project(':automl')
    implementation project(':codescanner')
    implementation project(':digitalink')
    implementation project(':documentscanner')
    implementation project(':entityextraction')
    implementation project(':genai')
    implementation project(':langid')
    implementation project(':material-showcase')
    implementation project(':smartreply')
    implementation project(':speech')
    implementation project(':translate')
    implementation project(':translate-showcase')
    implementation project(':vision-quickstart')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'
}

configurations {
    all*.exclude group: 'com.google.guava', module: 'listenablefuture'
}
